
 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hard Gel Manicure | Nails by Amanda</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffaf8;
      color: #4a2930;
      line-height: 1.6;
    }

    header {
      background: #f6e2e3;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      color: #b66f7d;
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 35px 20px;
      text-align: center;
    }

    h2 {
      color: #b66f7d;
      margin-bottom: 10px;
    }

    .intro {
      margin-bottom: 28px;
    }

    .designs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .design-card {
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(182, 111, 125, 0.12);
    }

    .design-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .design-card h3 {
      margin-top: 12px;
      color: #b66f7d;
    }

    .back-button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      background: #b66f7d;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    .back-button:hover {
      background: #985765;
    }

    footer {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      background: #f6e2e3;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Nails by Amanda</h1>
    <p>Hard Gel Designs</p>
  </header>

  <main>
    <h2>Hard Gel Manicure Collection</h2>

    <p class="intro">
      Explore our hard gel manicure designs and find your next nail inspiration!
    </p>

    <div class="designs">

      <div class="design-card">
        <img src="hg1.jfif" alt="Design 1">
        <h3>Design 1</h3>
      </div>

      <div class="design-card">
        <img src="hg2.jfif" alt="2">
        <h3>Design 2</h3>
      </div>

      <div class="design-card">
        <img src="hg3.jfif" alt="Design 3">
        <h3>Design 3</h3>
      </div>

    </div>

    <a href="index.html" class="back-button">← Back to Home</a>
  </main>

  <footer>
    © 2026 Nails by Amanda
  </footer>

</body>
</html>
